databases:
  - name: read-english-story-db
    plan: free
    region: singapore
    databaseName: read_english_story
    user: read_english_story

services:
  - type: web
    name: read-english-story-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: read-english-story-db
          property: internalConnectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: GOOGLE_OIDC_CLIENT_ID
        sync: false
      - key: GOOGLE_OIDC_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.6-flash

  - type: web
    name: read-english-story-web
    runtime: static
    rootDir: frontend
    buildCommand: >
      git clone -b stable --depth 1 https://github.com/flutter/flutter.git &&
      export PATH="$PATH:$(pwd)/flutter/bin" &&
      flutter build web --release --dart-define=BACKEND_BASE_URL=$BACKEND_BASE_URL
    staticPublishPath: build/web
    envVars:
      - key: BACKEND_BASE_URL
        value: https://read-english-story-backend.onrender.com
