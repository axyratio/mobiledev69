org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Temporary escape hatch for AGP 9's removal of getDefaultProguardFile('proguard-android.txt'):
# flutter_inappwebview_android (last published Oct 2024) still calls it. Remove once the plugin
# updates, since AGP 10 drops this flag. See:
# https://github.com/pichillilorenzo/flutter_inappwebview/issues/2852
android.r8.proguardAndroidTxt.disallowed=false

# Kotlin's incremental compiler crashes trying to relativize file paths when
# the project (here, D:) and the pub cache (C:\Users\...\Pub\Cache) sit on
# different Windows drives ("this and base files have different roots").
# Disabling incremental compilation avoids that code path; the build is
# slower but doesn't crash.
kotlin.incremental=false
