<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in — Read English Story</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F3F5FE;
            --surface: #FBFCFF;
            --text: #292B31;
            --muted: #595D6C;
            --accent: #796CBF;
            --accent-strong: #5D5294;
            --accent-container: #E7E5FE;
            --divider: rgba(41, 43, 49, .14);
            --error: #A4453F;
            --error-bg: #F7E6E5;
            --radius-md: 8px;
            --radius-lg: 14px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #161826;
                --surface: #232532;
                --text: #E9E9ED;
                --muted: #9397AB;
                --accent: #9184D9;
                --accent-strong: #B5ABFC;
                --accent-container: #2B2741;
                --divider: rgba(233, 233, 237, .16);
                --error: #E08A8A;
                --error-bg: #3A2630;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: var(--bg); color: var(--text); padding: 24px 16px;
            font-family: 'Inter', 'Noto Sans Thai', sans-serif;
        }
        .card {
            width: 100%; max-width: 360px; background: var(--surface);
            border: 1px solid var(--divider); border-radius: var(--radius-lg);
            padding: 28px 24px;
        }
        .kicker { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px; }
        .kicker .bar { width: 4px; height: 18px; background: var(--accent); border-radius: 2px; }
        .kicker span { font-size: 12px; letter-spacing: 1.2px; color: var(--muted); text-transform: uppercase; }
        h1 { font-size: 20px; font-weight: 600; text-align: center; margin: 0 0 24px; }
        label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
        input {
            width: 100%; padding: 12px 14px; margin-bottom: 16px; font-size: 15px;
            border: 1px solid var(--divider); border-radius: var(--radius-md);
            background: var(--surface); color: var(--text); font-family: inherit;
        }
        input:focus { outline: none; border-color: var(--accent); border-width: 1.5px; }
        button {
            width: 100%; padding: 13px; font-size: 15px; font-weight: 500; font-family: inherit;
            border-radius: var(--radius-md); cursor: pointer;
            background: transparent; color: var(--accent-strong); border: 1px solid var(--accent);
        }
        button:active { background: var(--accent-container); }
        .errors {
            background: var(--error-bg); color: var(--error); font-size: 13px;
            padding: 10px 12px; border-radius: var(--radius-md); margin-bottom: 16px; text-align: center;
        }
        .switch { text-align: center; font-size: 13px; color: var(--muted); margin: 16px 0 0; }
        .switch a { color: var(--accent-strong); text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>
    <div class="card">
        <div class="kicker"><div class="bar"></div><span>Oxford 3000</span></div>
        <h1>Sign in to continue</h1>
        {% if form.errors %}
            <p class="errors">Incorrect username or password.</p>
        {% endif %}
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <label for="id_username">Username</label>
            <input type="text" name="username" id="id_username" autocomplete="username" autofocus required>
            <label for="id_password">Password</label>
            <input type="password" name="password" id="id_password" autocomplete="current-password" required>
            <button type="submit">Sign in</button>
        </form>
        <p class="switch">Don't have an account? <a href="{% url 'oidc-signup' %}?next={{ next|urlencode }}">Sign up</a></p>
    </div>
</body>
</html>
